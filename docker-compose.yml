services:
  kairo-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - KAIRO_PORT=8080
      - KAIRO_LOG_LEVEL=info
      - KAIRO_DATABASE_URL=${KAIRO_DATABASE_URL:-sqlite::memory:}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  kairo-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - KAIRO_SERVER_URL=http://kairo-server:8080
      - NEXT_PUBLIC_KAIRO_SERVER_URL=http://localhost:8080
    depends_on:
      kairo-server:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: kairo-network
