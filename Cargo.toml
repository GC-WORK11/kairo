[workspace]
resolver = "2"
members = [
  "crates/kairo-core",
  "crates/kairo-server",
  "crates/kairo-cli",
  "crates/kairo-mcp",
  "crates/kairo-github-action",
  "crates/kairo-ingest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kairo"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
chrono = "0.4"
